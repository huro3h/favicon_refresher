<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 220px; font-family: sans-serif; padding: 10px; margin: 0; }
    h3 { margin-top: 0; font-size: 16px; margin-bottom: 12px; }
    .setting-group { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .setting-group label { font-size: 13px; color: #333; }
    .setting-group input { width: 60px; padding: 4px; font-size: 13px; text-align: center; }
    button { width: 100%; padding: 8px; font-size: 14px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    button:hover { background: #0056b3; }
    #status { margin-top: 10px; font-size: 12px; color: #555; text-align: center; }
  </style>
</head>
<body>
<h3>Favicon Refresher</h3>

<div class="setting-group">
  <label for="concurrency-input">同時に開く数 (1〜50):</label>
  <input type="number" id="concurrency-input" min="1" max="50" value="5">
</div>

<button id="start-btn">アイコンを再取得</button>
<div id="status">ボタンを押すと開始します</div>
<script src="popup.js"></script>
</body>
</html>
